<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6c4cf1">
  <title>Prepaso Secundaria · Lecciones</title>
  <style>
    :root{
      --brand:#6c4cf1;--brand-dark:#5034c9;--brand-soft:#eeeaff;
      --ink:#172033;--muted:#677085;--line:#e6e8ef;--surface:#fff;
      --bg:#f5f6fb;--ok:#178957;--ok-soft:#e7f8ef;--bad:#c53b48;
      --bad-soft:#fff0f1;--warning:#a66300;--shadow:0 12px 30px rgba(32,25,71,.09)
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;color:var(--ink);background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
    button,input,select{font:inherit}
    button{min-height:46px;cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.58}
    .app{min-height:100vh;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);padding:max(12px,env(safe-area-inset-top)) 16px 12px}
    .topbar-inner{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
    .brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;color:white;background:linear-gradient(135deg,var(--brand),#8a6fff);font-weight:900;box-shadow:0 8px 18px rgba(108,76,241,.25)}
    .brand-copy{min-width:0}.brand-copy strong,.brand-copy span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-copy span{font-size:.78rem;color:var(--muted);margin-top:2px}
    .stats{display:flex;gap:7px}.pill{display:flex;align-items:center;gap:5px;padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:.82rem;font-weight:800;white-space:nowrap}
    main{max-width:760px;margin:auto;padding:20px 16px}
    .hero{padding:22px;border-radius:24px;background:linear-gradient(135deg,#6848ed,#8f75ff);color:white;box-shadow:var(--shadow);margin-bottom:18px}
    .eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;font-weight:900;opacity:.82}.hero h1{font-size:clamp(1.55rem,6vw,2.15rem);line-height:1.08;margin:9px 0}.hero p{margin:0;line-height:1.5;opacity:.92}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:24px 2px 12px}.section-title h2{margin:0;font-size:1.12rem}.section-title span{color:var(--muted);font-size:.84rem}
    .subject-grid{display:grid;gap:12px}.subject-card{width:100%;border:1px solid var(--line);border-radius:20px;background:#fff;padding:18px;text-align:left;display:grid;grid-template-columns:54px 1fr auto;gap:13px;align-items:center;box-shadow:0 6px 18px rgba(32,25,71,.05)}.subject-icon{display:grid;place-items:center;width:54px;height:54px;border-radius:17px;background:var(--brand-soft);font-size:1.55rem}.subject-card h2{font-size:1.08rem;margin:0 0 5px}.subject-card p{font-size:.83rem;color:var(--muted);line-height:1.4;margin:0}.subject-go{color:var(--brand);font-size:1.3rem;font-weight:950}
    .lesson-list{display:grid;gap:11px}.lesson{width:100%;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:15px;text-align:left;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;box-shadow:0 5px 15px rgba(32,25,71,.04)}
    .lesson:active{transform:scale(.992)}.lesson-num{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:var(--brand-soft);color:var(--brand-dark);font-weight:900}.lesson h3{font-size:1rem;margin:0 0 4px}.lesson p{font-size:.82rem;color:var(--muted);margin:0}.lesson-status{font-size:.8rem;font-weight:900;color:var(--brand)}.lesson-status.done{color:var(--ok)}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:clamp(18px,5vw,28px)}
    .lesson-head{margin-bottom:14px}.back{border:0;background:transparent;color:var(--brand-dark);font-weight:850;padding:0 4px;min-height:40px}.progress-row{display:flex;align-items:center;gap:10px;margin:8px 0 18px}.progress-track{height:10px;border-radius:999px;background:#e9eaf1;overflow:hidden;flex:1}.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),#967eff);border-radius:inherit;transition:width .25s}.progress-label{font-size:.78rem;color:var(--muted);font-weight:800}
    .role{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-dark);font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.screen h1{font-size:clamp(1.45rem,5vw,1.9rem);line-height:1.17;margin:12px 0}.screen h2{font-size:1.22rem;line-height:1.25;margin:14px 0}.lead,.prompt{font-size:1.04rem;line-height:1.56;margin:12px 0 18px}.muted{color:var(--muted)}
    .stimulus{margin:15px 0 18px;padding:16px;border:1px solid #dfe2ec;border-radius:16px;background:#fafbff}.stimulus-label{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.stimulus h3{font-size:1.02rem;margin:9px 0}.stimulus p{white-space:pre-line;line-height:1.62;margin:0}.stimulus-source{display:block;margin-top:10px;color:var(--muted);font-size:.72rem}
    .example-list{display:grid;gap:9px;margin:17px 0}.example{padding:12px 14px;border-radius:13px;background:#f7f7fc;border:1px solid var(--line);line-height:1.4}.memory{padding:14px;border-radius:14px;background:#fff7df;border-left:4px solid #e1a216;margin-top:16px;line-height:1.45}
    .options{display:grid;gap:10px;margin:18px 0}.option{width:100%;text-align:left;border:2px solid var(--line);border-radius:15px;background:#fff;padding:13px 15px;color:var(--ink);font-weight:750}.option.selected{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark)}
    .field{width:100%;min-height:50px;border:2px solid var(--line);border-radius:14px;background:white;padding:10px 13px;color:var(--ink);outline:none}.field:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}.input-wrap{display:flex;align-items:center;gap:10px;margin:18px 0}.input-wrap .field{flex:1}.input-label{font-weight:850}.suffix{color:var(--muted);font-weight:750}
    .range-wrap{padding:17px;border:1px solid var(--line);border-radius:16px;background:#fafaff;margin:18px 0}.range-value{text-align:center;color:var(--brand-dark);font-size:2rem;font-weight:950;margin-bottom:8px}.range{width:100%;accent-color:var(--brand)}.range-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;font-weight:800}
    .match-list{display:grid;gap:10px;margin:18px 0}.match-row{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px}.match-left{padding:12px;border-radius:13px;background:#f7f7fc;border:1px solid var(--line);font-weight:750}.match-arrow{text-align:center;color:var(--muted);display:none}
    .order-list{display:grid;gap:9px;margin:18px 0}.order-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:9px;border:1px solid var(--line);border-radius:14px;background:#fafaff;padding:8px}.order-index{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--brand-soft);color:var(--brand-dark);font-weight:900}.order-actions{display:flex;gap:5px}.icon-btn{width:42px;min-height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--brand-dark);font-weight:950}
    .feedback{border-radius:16px;padding:14px 15px;margin:17px 0;line-height:1.45}.feedback.ok{background:var(--ok-soft);color:#0e6640;border:1px solid #bce9d1}.feedback.bad{background:var(--bad-soft);color:#8e2631;border:1px solid #f2c4c9}.hint{margin-top:9px;padding-top:9px;border-top:1px solid currentColor;opacity:.88}.actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:20px}.btn{width:100%;border:0;border-radius:14px;padding:13px 16px;font-weight:900}.btn-primary{background:var(--brand);color:#fff;box-shadow:0 8px 18px rgba(108,76,241,.24)}.btn-primary:active{background:var(--brand-dark)}.btn-secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.btn-danger{background:var(--bad);color:#fff}
    .result{display:grid;place-items:center;text-align:center}.result-icon{display:grid;place-items:center;width:82px;height:82px;border-radius:50%;background:var(--ok-soft);font-size:2.3rem;margin:8px}.score{font-size:2.25rem;font-weight:950;color:var(--brand-dark);margin:6px}.source-note{font-size:.76rem;color:var(--muted);line-height:1.45;margin:20px 3px;text-align:center}
    .loading,.error{display:grid;place-items:center;text-align:center;min-height:60vh}.spinner{width:42px;height:42px;border:4px solid #ded9fb;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}@keyframes spin{to{transform:rotate(360deg)}}
    .modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(17,21,33,.55);padding:20px}.modal.open{display:grid}.modal-card{width:min(100%,420px);background:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}.modal-card h2{margin:0 0 9px}.modal-card p{color:var(--muted);line-height:1.5}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
    .footer-actions{margin-top:22px;display:flex;justify-content:center}.link-btn{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:.8rem;min-height:40px}
    @media(min-width:620px){.actions{grid-template-columns:1fr 1fr}.actions .btn:only-child{grid-column:1/-1}.match-row{grid-template-columns:1fr 24px 1fr}.match-arrow{display:block}.card{min-height:430px}.lesson:hover{border-color:#cfc7ff;box-shadow:0 9px 22px rgba(69,47,161,.09)}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><div class="brand-mark">P</div><div class="brand-copy"><strong>Prepaso Secundaria</strong><span id="headerSubtitle">1.° de secundaria</span></div></div>
        <div class="stats"><div class="pill">🔥 <span id="streakValue">1</span></div><div class="pill">⚡ <span id="xpValue">0</span> XP</div></div>
      </div>
    </header>
    <main id="app"><div class="loading"><div><div class="spinner"></div><strong>Cargando lecciones…</strong></div></div></main>
  </div>

  <div class="modal" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
    <div class="modal-card">
      <h2 id="resetTitle">¿Reiniciar el progreso?</h2>
      <p>Se borrarán en este dispositivo los avances, respuestas y XP de esta demostración. El contenido de GitHub no se modificará.</p>
      <div class="modal-actions"><button class="btn btn-secondary" data-action="cancel-reset">Cancelar</button><button class="btn btn-danger" data-action="confirm-reset">Sí, reiniciar</button></div>
    </div>
  </div>

  <script>
  (function(){
    "use strict";

    var CONTENT_SOURCES = [
      {id:"matematica",label:"Matemática",icon:"➗",url:"https://raw.githubusercontent.com/WilsonCcopa/prepaso-pisa/refs/heads/main/prepaso-secundaria-content/content/pe/secundaria/1/matematica/M1-enteros-v1.json"},
      {id:"lectura",label:"Lectura",icon:"📖",url:"https://raw.githubusercontent.com/WilsonCcopa/prepaso-pisa/refs/heads/main/prepaso-secundaria-content/content/pe/secundaria/1/lectura/L1-localizar-integrar-v1.json"}
    ];
    var PROGRESS_KEY = "prepaso_secundaria_demo_progress_v1";
    var CACHE_KEY = "prepaso_secundaria_demo_catalog_cache_v2";
    var INTERACTIVE = ["single_choice","matching","number_line","number_line_move","ordering","number_input"];
    var app = document.getElementById("app");
    var state = {catalog:[],data:null,currentLessonId:null,screenIndex:0,feedback:null,drafts:{}};
    var progress = loadProgress();

    function emptyProgress(){return {xp:0,streak:0,lastActive:"",lessons:{}};}
    function loadProgress(){
      try{return Object.assign(emptyProgress(),JSON.parse(localStorage.getItem(PROGRESS_KEY)||"{}"));}
      catch(e){return emptyProgress();}
    }
    function saveProgress(){
      try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress));}catch(e){}
      updateStats();
    }
    function localDay(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,"0"),String(date.getDate()).padStart(2,"0")].join("-");}
    function touchStreak(){
      var now=new Date(),today=localDay(now);
      if(progress.lastActive===today)return;
      var yesterday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
      progress.streak=progress.lastActive===localDay(yesterday)?Math.max(1,progress.streak||0)+1:1;
      progress.lastActive=today;saveProgress();
    }
    function updateStats(){
      document.getElementById("xpValue").textContent=progress.xp||0;
      document.getElementById("streakValue").textContent=progress.streak||1;
    }
    function esc(value){return String(value==null?"":value).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
    function lessonProgress(id){
      if(!progress.lessons[id])progress.lessons[id]={screenIndex:0,responses:{},completed:false,mastery:0,bonusAwarded:false};
      if(!progress.lessons[id].responses)progress.lessons[id].responses={};
      return progress.lessons[id];
    }
    function lessonById(id){return state.data.unit.lessons.find(function(l){return l.id===id;});}
    function stimulusById(id){return ((state.data&&state.data.unit.stimuli)||[]).find(function(item){return item.id===id;});}
    function roleLabel(role){return ({goal:"Objetivo",hook:"Reto inicial",model:"Aprende",guided_practice:"Práctica guiada",independent_practice:"Practica",error_analysis:"Detecta el error",transfer:"Desafío",exit_ticket:"Ticket de salida",reward:"Resultado"})[role]||"Lección";}

    async function loadContent(){
      var cached={};try{cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"{}");}catch(e){}
      var loaded=await Promise.all(CONTENT_SOURCES.map(async function(source){
        var data=null;
        try{
          var response=await fetch(source.url+"?v=2026.09.2",{cache:"no-store"});
          if(!response.ok)throw new Error("HTTP "+response.status);
          data=await response.json();
          if(!data.unit||!Array.isArray(data.unit.lessons))throw new Error("Formato no compatible");
        }catch(error){data=cached[source.id]||null;}
        return data?{source:source,data:data}:null;
      }));
      state.catalog=loaded.filter(Boolean);
      if(!state.catalog.length){renderLoadError();return;}
      var nextCache={};state.catalog.forEach(function(item){nextCache[item.source.id]=item.data;});
      try{localStorage.setItem(CACHE_KEY,JSON.stringify(nextCache));}catch(e){}
      touchStreak();renderCatalog();
    }

    function renderLoadError(){
      app.innerHTML='<div class="error"><div><h1>No pudimos cargar las lecciones</h1><p class="muted">Comprueba la conexión a internet. El HTML necesita acceder al archivo RAW de GitHub al menos una vez.</p><button class="btn btn-primary" data-action="reload">Reintentar</button></div></div>';
    }

    function renderCatalog(){
      state.data=null;state.currentLessonId=null;state.feedback=null;
      document.getElementById("headerSubtitle").textContent="1.° de secundaria";
      var cards=state.catalog.map(function(item){
        var unit=item.data.unit,completed=unit.lessons.filter(function(l){return lessonProgress(l.id).completed;}).length;
        return '<button class="subject-card" data-action="open-subject" data-id="'+esc(item.source.id)+'"><span class="subject-icon">'+esc(item.source.icon)+'</span><span><h2>'+esc(item.source.label)+'</h2><p>'+esc(unit.title)+' · '+completed+'/'+unit.readyLessonCount+' completadas</p></span><span class="subject-go">›</span></button>';
      }).join("");
      app.innerHTML='<section class="hero"><div class="eyebrow">Demo de contenidos</div><h1>¿Qué aprenderás hoy?</h1><p>Elige una materia. El mismo motor carga cada unidad desde su propio JSON.</p></section><div class="subject-grid">'+cards+'</div><div class="footer-actions"><button class="link-btn" data-action="open-reset">Reiniciar progreso de prueba</button></div>';
      saveProgress();window.scrollTo(0,0);
    }

    function openSubject(id){
      var item=state.catalog.find(function(entry){return entry.source.id===id;});if(!item)return;
      state.data=item.data;state.currentLessonId=null;state.feedback=null;renderHome();
    }

    function renderHome(){
      state.currentLessonId=null;state.feedback=null;
      var unit=state.data.unit;
      var subjectLabel=unit.subject==="matematica"?"Matemática":"Lectura";
      document.getElementById("headerSubtitle").textContent=subjectLabel+" · 1.° de secundaria";
      var lessonCards=unit.lessons.map(function(lesson){
        var lp=lessonProgress(lesson.id),done=lp.completed;
        var status=done?"✓ Completada":(lp.screenIndex>0?"Continuar":"Empezar");
        return '<button class="lesson" data-action="open-lesson" data-id="'+esc(lesson.id)+'"><span class="lesson-num">'+esc(lesson.sequence)+'</span><span><h3>'+esc(lesson.title)+'</h3><p>'+esc(lesson.estimatedMinutes)+' min · '+esc(lesson.subtitle||lesson.learningOutcome)+'</p></span><span class="lesson-status '+(done?"done":"")+'">'+status+'</span></button>';
      }).join("");
      app.innerHTML='<button class="back" data-action="catalog">← Todas las materias</button><section class="hero"><div class="eyebrow">Unidad '+esc(unit.sequence)+' · '+esc(subjectLabel)+'</div><h1>'+esc(unit.title)+'</h1><p>'+esc(unit.unitOutcome)+'</p></section><div class="section-title"><h2>Microlecciones</h2><span>'+esc(unit.readyLessonCount)+' disponibles</span></div><div class="lesson-list">'+lessonCards+'</div><p class="source-note">Secuencia editorial de Prepaso alineada al CNEB. MINEDU define competencias y desempeños, no un orden único de capítulos.</p><div class="footer-actions"><button class="link-btn" data-action="open-reset">Reiniciar progreso de prueba</button></div>';
      saveProgress();window.scrollTo(0,0);
    }

    function openLesson(id){
      var lesson=lessonById(id);if(!lesson)return;
      var lp=lessonProgress(id);
      state.currentLessonId=id;state.screenIndex=lp.completed?0:Math.min(lp.screenIndex||0,lesson.screens.length-1);state.feedback=null;
      renderLesson();window.scrollTo(0,0);
    }

    function renderLesson(){
      var lesson=lessonById(state.currentLessonId),screen=lesson.screens[state.screenIndex],lp=lessonProgress(lesson.id);
      var pct=Math.round(((state.screenIndex+1)/lesson.screens.length)*100);
      document.getElementById("headerSubtitle").textContent=lesson.id+" · "+lesson.title;
      app.innerHTML='<div class="lesson-head"><button class="back" data-action="home">← Todas las lecciones</button><div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><span class="progress-label">'+(state.screenIndex+1)+'/'+lesson.screens.length+'</span></div></div><section class="card screen">'+screenHTML(screen,lesson,lp)+'</section>';
    }

    function screenHTML(screen,lesson,lp){
      var top='<span class="role">'+esc(roleLabel(screen.role))+'</span>';
      if(screen.type==="intro")return top+'<h1>'+esc(screen.title)+'</h1><p class="lead">'+esc(screen.body)+'</p><div class="actions"><button class="btn btn-primary" data-action="next">'+esc(screen.cta||"Continuar")+'</button></div>';
      if(screen.type==="content_card"){
        var examples=(screen.examples||[]).map(function(x){return '<div class="example">'+esc(x)+'</div>';}).join("");
        return top+'<h2>'+esc(screen.title)+'</h2><p class="lead">'+esc(screen.body)+'</p><div class="example-list">'+examples+'</div>'+(screen.memoryAid?'<div class="memory">💡 <strong>Recuerda:</strong> '+esc(screen.memoryAid)+'</div>':"")+'<div class="actions"><button class="btn btn-primary" data-action="next">Entendido</button></div>';
      }
      if(screen.type==="lesson_complete")return completionHTML(screen,lesson,lp);
      return interactionHTML(screen);
    }

    function interactionHTML(screen){
      var disabled=state.feedback&&(state.feedback.correct||state.feedback.locked),body="";
      if(screen.type==="single_choice"){
        var selected=(state.drafts[screen.id]||{}).selected;
        body='<div class="options">'+screen.options.map(function(o){return '<button class="option '+(selected===o.id?"selected":"")+'" data-action="select-option" data-value="'+esc(o.id)+'" '+(disabled?"disabled":"")+'>'+esc(o.text)+'</button>';}).join("")+'</div>';
      }else if(screen.type==="number_input"){
        var inputValue=(state.drafts[screen.id]||{}).value;
        body='<div class="input-wrap"><span class="input-label">'+esc(screen.inputLabel||"")+'</span><input class="field" id="numberAnswer" type="number" inputmode="decimal" value="'+esc(inputValue==null?"":inputValue)+'" '+(disabled?"disabled":"")+'><span class="suffix">'+esc(screen.inputSuffix||"")+'</span></div>';
      }else if(screen.type==="number_line"||screen.type==="number_line_move"){
        var draft=state.drafts[screen.id]||{},value=draft.value;
        if(value==null)value=Math.max(screen.range.min,Math.min(screen.range.max,screen.type==="number_line_move"?screen.startValue:0));
        body='<div class="range-wrap">'+(screen.type==="number_line_move"?'<p class="muted">Inicio: <strong>'+esc(screen.startValue)+'</strong> · Cambio: <strong>'+esc(screen.changeValue>0?"+"+screen.changeValue:screen.changeValue)+'</strong></p>':"")+'<div class="range-value" id="rangeValue">'+esc(value)+'</div><input class="range" id="rangeAnswer" type="range" min="'+esc(screen.range.min)+'" max="'+esc(screen.range.max)+'" step="'+esc(screen.range.step)+'" value="'+esc(value)+'" '+(disabled?"disabled":"")+'><div class="range-labels"><span>'+esc(screen.range.min)+'</span><span>'+esc(screen.range.max)+'</span></div></div>';
      }else if(screen.type==="matching"){
        var rights=screen.pairs.map(function(p){return {id:p.rightId,text:p.right};});
        body='<div class="match-list">'+screen.pairs.map(function(p){return '<div class="match-row"><div class="match-left">'+esc(p.left)+'</div><div class="match-arrow">→</div><select class="field match-select" data-left="'+esc(p.leftId)+'" '+(disabled?"disabled":"")+'><option value="">Elige…</option>'+rights.map(function(r){return '<option value="'+esc(r.id)+'">'+esc(r.text)+'</option>';}).join("")+'</select></div>';}).join("")+'</div>';
      }else if(screen.type==="ordering"){
        var orderDraft=state.drafts[screen.id];if(!orderDraft){orderDraft={order:screen.items.map(function(i){return i.id;})};state.drafts[screen.id]=orderDraft;}
        body='<div class="order-list">'+orderDraft.order.map(function(id,index){var item=screen.items.find(function(i){return i.id===id;});return '<div class="order-row"><span class="order-index">'+(index+1)+'</span><strong>'+esc(item.text)+'</strong><span class="order-actions"><button class="icon-btn" data-action="order-up" data-index="'+index+'" '+(index===0||disabled?"disabled":"")+' aria-label="Subir">↑</button><button class="icon-btn" data-action="order-down" data-index="'+index+'" '+(index===orderDraft.order.length-1||disabled?"disabled":"")+' aria-label="Bajar">↓</button></span></div>';}).join("")+'</div>';
      }
      var feedback=feedbackHTML(screen);
      var controls="";
      if(!state.feedback)controls='<div class="actions"><button class="btn btn-primary" data-action="check">Comprobar</button></div>';
      else if(state.feedback.correct||state.feedback.locked)controls='<div class="actions"><button class="btn btn-primary" data-action="next">Continuar</button></div>';
      else controls='<div class="actions"><button class="btn btn-secondary" data-action="retry">Intentar otra vez</button></div>';
      return '<span class="role">'+esc(roleLabel(screen.role))+'</span>'+stimulusHTML(screen)+'<p class="prompt">'+esc(screen.prompt)+'</p>'+body+feedback+controls;
    }

    function stimulusHTML(screen){
      if(!screen.stimulusId)return "";
      var item=stimulusById(screen.stimulusId);
      if(!item)return "";
      return '<article class="stimulus"><div class="stimulus-label"><span>'+esc(item.genre||"Texto")+'</span><span>'+esc(item.format||"")+'</span></div><h3>'+esc(item.title)+'</h3><p>'+esc(item.content)+'</p>'+(item.sourceNote?'<span class="stimulus-source">'+esc(item.sourceNote)+'</span>':"")+'</article>';
    }

    function feedbackHTML(screen){
      if(!state.feedback)return "";
      var f=state.feedback,extra="";
      if(!f.correct&&f.hint)extra='<div class="hint">💡 '+esc(f.hint)+'</div>';
      if(f.locked&&f.solution)extra+='<div class="hint"><strong>Respuesta:</strong> '+esc(f.solution)+'</div>';
      return '<div class="feedback '+(f.correct?"ok":"bad")+'"><strong>'+(f.correct?"✓ ¡Bien hecho!":"Revisemos")+'</strong><br>'+esc(f.message)+extra+'</div>';
    }

    function readAndCheck(screen){
      var answer=null,correct=false,solution="";
      if(screen.type==="single_choice"){
        answer=(state.drafts[screen.id]||{}).selected;
        if(!answer)return missingAnswer();
        correct=answer===screen.correctOptionId;
        var option=screen.options.find(function(o){return o.id===answer;});
        solution=screen.options.find(function(o){return o.id===screen.correctOptionId;}).text;
        finishCheck(screen,correct,option.feedback,solution);return;
      }
      if(screen.type==="number_input"){
        var raw=document.getElementById("numberAnswer").value;if(raw==="")return missingAnswer();
        answer=Number(raw);state.drafts[screen.id]={value:raw};
        correct=Math.abs(answer-screen.answer.value)<=Number(screen.answer.tolerance||0);solution=String(screen.answer.value);
      }else if(screen.type==="number_line"||screen.type==="number_line_move"){
        answer=Number(document.getElementById("rangeAnswer").value);state.drafts[screen.id]={value:answer};correct=answer===screen.correctValue;solution=String(screen.correctValue);
      }else if(screen.type==="matching"){
        var selects=Array.prototype.slice.call(document.querySelectorAll(".match-select"));
        answer={};for(var i=0;i<selects.length;i++){if(!selects[i].value)return missingAnswer();answer[selects[i].dataset.left]=selects[i].value;}
        correct=screen.pairs.every(function(p){return answer[p.leftId]===p.rightId;});solution=screen.pairs.map(function(p){return p.left+" → "+p.right;}).join(" · ");
      }else if(screen.type==="ordering"){
        answer=state.drafts[screen.id].order.slice();correct=answer.join("|")===screen.correctOrder.join("|");
        solution=screen.correctOrder.map(function(id){return screen.items.find(function(i){return i.id===id;}).text;}).join(" < ");
      }
      finishCheck(screen,correct,correct?(screen.feedbackCorrect||"Respuesta correcta."):(screen.feedbackIncorrect||"Revisa tu respuesta."),solution);
    }

    function missingAnswer(){state.feedback={correct:false,locked:false,message:"Completa una respuesta antes de comprobar.",hint:""};renderLesson();}
    function finishCheck(screen,correct,message,solution){
      var lp=lessonProgress(state.currentLessonId),old=lp.responses[screen.id]||{attempts:0,xpAwarded:false};
      old.attempts=(old.attempts||0)+1;old.correct=correct;old.answerAt=new Date().toISOString();
      var locked=!correct&&old.attempts>=Number(screen.maxAttempts||2);
      if(correct&&!old.xpAwarded){progress.xp+=Number(screen.xp||0);old.xpAwarded=true;}
      lp.responses[screen.id]=old;saveProgress();
      state.feedback={correct:correct,locked:locked,message:message,hint:(!correct&&screen.assistanceAllowed!==false)?screen.hint:"",solution:solution};renderLesson();
    }

    function masteryFor(lesson){
      var lp=lessonProgress(lesson.id),score=0;
      lesson.screens.forEach(function(s){if(INTERACTIVE.indexOf(s.type)>=0&&lp.responses[s.id]&&lp.responses[s.id].correct)score+=Number(s.masteryWeight||0);});
      return Math.max(0,Math.min(1,score));
    }
    function finalizeLesson(lesson){
      var lp=lessonProgress(lesson.id),mastery=masteryFor(lesson),minimum=Number(state.data.unit.masteryPolicy.minimumScore||.8);
      lp.mastery=mastery;lp.completed=true;
      if(mastery>=minimum&&!lp.bonusAwarded){progress.xp+=Number(state.data.unit.gamification.independentBonusXp||0);lp.bonusAwarded=true;}
      saveProgress();
    }
    function completionHTML(screen,lesson,lp){
      var score=Math.round((lp.mastery||masteryFor(lesson))*100),minimum=Math.round(Number(state.data.unit.masteryPolicy.minimumScore||.8)*100),passed=score>=minimum;
      return '<div class="result"><div class="result-icon">'+(passed?"🏆":"📚")+'</div><span class="role">'+esc(roleLabel(screen.role))+'</span><h1>'+esc(screen.title)+'</h1><p class="lead">'+esc(screen.body)+'</p><div class="score">'+score+'%</div><p class="muted">'+(passed?"Dominio alcanzado":"Meta de dominio: "+minimum+"%")+'</p><p>'+esc(screen.unlockMessage||"")+'</p></div><div class="actions"><button class="btn btn-secondary" data-action="restart-lesson">Repetir lección</button><button class="btn btn-primary" data-action="home">Volver a las lecciones</button></div>';
    }

    function goNext(){
      var lesson=lessonById(state.currentLessonId),lp=lessonProgress(lesson.id);
      if(state.screenIndex<lesson.screens.length-1){state.screenIndex++;lp.screenIndex=state.screenIndex;state.feedback=null;if(lesson.screens[state.screenIndex].type==="lesson_complete")finalizeLesson(lesson);else saveProgress();renderLesson();window.scrollTo(0,0);}else renderHome();
    }
    function moveOrder(direction,index){
      var lesson=lessonById(state.currentLessonId),screen=lesson.screens[state.screenIndex],arr=state.drafts[screen.id].order,next=index+direction;
      if(next<0||next>=arr.length)return;var temp=arr[index];arr[index]=arr[next];arr[next]=temp;renderLesson();
    }

    document.addEventListener("click",function(event){
      var button=event.target.closest("[data-action]");if(!button)return;
      var action=button.dataset.action;
      if(action==="open-subject")openSubject(button.dataset.id);
      else if(action==="catalog")renderCatalog();
      else if(action==="open-lesson")openLesson(button.dataset.id);
      else if(action==="home")renderHome();
      else if(action==="next")goNext();
      else if(action==="select-option"){var lesson=lessonById(state.currentLessonId),screen=lesson.screens[state.screenIndex];state.drafts[screen.id]={selected:button.dataset.value};state.feedback=null;renderLesson();}
      else if(action==="check"){var l=lessonById(state.currentLessonId);readAndCheck(l.screens[state.screenIndex]);}
      else if(action==="retry"){state.feedback=null;renderLesson();}
      else if(action==="order-up")moveOrder(-1,Number(button.dataset.index));
      else if(action==="order-down")moveOrder(1,Number(button.dataset.index));
      else if(action==="restart-lesson"){
        var id=state.currentLessonId,previous=lessonProgress(id),freshResponses={};
        Object.keys(previous.responses||{}).forEach(function(screenId){freshResponses[screenId]={attempts:0,correct:false,xpAwarded:!!previous.responses[screenId].xpAwarded};});
        progress.lessons[id]={screenIndex:0,responses:freshResponses,completed:false,mastery:0,bonusAwarded:previous.bonusAwarded};
        saveProgress();state.screenIndex=0;state.feedback=null;state.drafts={};renderLesson();
      }
      else if(action==="reload"){app.innerHTML='<div class="loading"><div><div class="spinner"></div><strong>Cargando lecciones…</strong></div></div>';loadContent();}
      else if(action==="open-reset")document.getElementById("resetModal").classList.add("open");
      else if(action==="cancel-reset")document.getElementById("resetModal").classList.remove("open");
      else if(action==="confirm-reset"){localStorage.removeItem(PROGRESS_KEY);progress=emptyProgress();touchStreak();state.drafts={};document.getElementById("resetModal").classList.remove("open");renderCatalog();}
    });
    document.addEventListener("input",function(event){
      if(event.target.id==="rangeAnswer"){document.getElementById("rangeValue").textContent=event.target.value;var l=lessonById(state.currentLessonId),s=l.screens[state.screenIndex];state.drafts[s.id]={value:Number(event.target.value)};}
    });

    updateStats();loadContent();
  })();
  </script>
</body>
</html>
